services:
  app:
    image: mcr.microsoft.com/devcontainers/javascript-node:1-24-bookworm
    command: sleep infinity
    volumes:
      - ../..:/workspaces:cached
    network_mode: service:db
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: development
      DB_HOST: 127.0.0.1
      DB_PORT: "3306"
      DB_USER: root
      DB_PASSWORD: CodespacesLocalOnly03
      DB_NAME: mini_supermarket
      CODESPACE_SETUP: "1"
  db:
    image: mariadb:10.11
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: CodespacesLocalOnly03
      MARIADB_DATABASE: mini_supermarket
    volumes:
      - supermarket-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 30
volumes:
  supermarket-data:
