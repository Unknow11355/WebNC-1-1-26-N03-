<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Báo Cáo Quản Trị - Buổi 7</title>
    <!-- Nhúng file CSS dùng chung của hệ thống -->
    <link rel="stylesheet" href="style.css">
    <!-- Nhúng file CSS riêng của trang báo cáo vừa tạo -->
    <link rel="stylesheet" href="reports.css">

    <!-- Tải thư viện Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
    <!-- THANH MENU ĐIỀU HƯỚNG -->
    <nav>
        <a href="reports.html">📊 Báo Cáo & Xuất CSV</a>
        <a href="audit.html">📝 Nhật Ký Hoạt Động</a>
        <a href="upload.html">☁️ Tải Ảnh (Bảo Mật)</a>
    </nav>

    <h2>Hệ Thống Báo Cáo - Admin</h2>

    <div class="filter-bar">
        <label>Từ ngày:</label> <input type="date" id="fromDate">
        <label>Đến ngày:</label> <input type="date" id="toDate">
        <button id="btn-revenue" data-action="revenue">1. Báo cáo Doanh Thu</button>
        <button id="btn-products" data-action="products">2. Báo cáo Sản Phẩm</button>
        <button id="btn-employees" data-action="employees">3. Báo cáo Nhân Viên</button>
        <button class="export-btn" id="btn-export">Xuất CSV An Toàn</button>
    </div>

    <!-- Khung chứa để vẽ biểu đồ -->
    <div class="chart-container">
        <canvas id="myReportChart"></canvas>
    </div>

    <h3 id="reportTitle">Chưa chọn báo cáo</h3>
    <table id="reportTable">
        <thead id="tableHead"></thead>
        <tbody id="tableBody">
            <tr><td colspan="100%">Vui lòng chọn loại báo cáo và khoảng thời gian.</td></tr>
        </tbody>
    </table>

    <script type="module" src="reports.js"></script>
</body>
</html>
