<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tải Ảnh - Admin</title>
    <!-- Nhúng CSS tổng và CSS riêng -->
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="upload.css">
</head>
<body>
    <nav>
        <a href="reports.html">📊 Báo Cáo & Xuất CSV</a>
        <a href="audit.html">📝 Nhật Ký Hoạt Động</a>
        <a href="upload.html">☁️ Tải Ảnh (Bảo Mật)</a>
    </nav>

    <h2>Quản lý hình ảnh sản phẩm</h2>

    <div class="upload-box">
        <p>Chọn ảnh sản phẩm (Chỉ nhận .jpg, .jpeg, .png, .webp)</p>
        <input type="file" id="fileInput" accept=".jpg, .jpeg, .png, .webp">
        <button id="btnUpload" class="btn-success">Tải Ảnh Lên</button>

        <!-- Khung xem trước ảnh -->
        <img id="previewImage" alt="Bản xem trước ảnh tải lên">
    </div>

    <!-- Gọi file JS riêng biệt -->
    <script src="upload.js"></script>
</body>
</html>
